<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6FB">
<title>フタリチョウ ふたりの立て替えと精算</title>
<link rel="icon" href="img/icon_192.png">
<link rel="stylesheet" href="css/app.css">
<script src="js/config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js" defer></script>
</head>
<body>
<div id="app">
  <main id="screen" tabindex="-1"></main>
  <div id="fab"></div>
  <nav id="tabs" hidden></nav>
  <div id="sheet" hidden><div class="veil"></div><div class="sheet-in"></div></div>
  <div id="coach" hidden></div>
  <div id="toast" hidden></div>
</div>
<script type="module" src="js/app.js"></script>
<script>
// 保険: 画面の部品(js/app.js)が読み込めずに何も出ない時だけ、案内と「もう一度」を出す
window.addEventListener('load', function () { setTimeout(function () {
  var s = document.getElementById('screen');
  if (window.__ftBooted || !s || s.children.length) return;
  s.innerHTML = '<div class="page" style="justify-content:center;text-align:center"><p style="font-size:18px;line-height:1.7">画面の読み込みに失敗しました。</p><button class="btn main" style="margin-top:24px" onclick="location.reload()">もう一度読み込む</button></div>';
}, 4000); });
</script>
</body>
</html>
