<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>定時で帰さない｜残業させるほど儲かるクリッカー</title>
<meta name="description" content="夜のオフィスをタップして売上を伸ばす。儲かるほど社員の顔がやつれていく。いつ「全員帰す」を押すかはあなた次第。スマホで遊べる無料のブラウザゲーム。">
<meta name="theme-color" content="#0b1230">
<link rel="canonical" href="https://yurustudio.github.io/teiji/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="定時で帰さない">
<meta property="og:title" content="定時で帰さない｜残業させるほど儲かるクリッカー">
<meta property="og:description" content="タップで残業、売上は青天井。でも社員の顔がどんどん…。あなたは全員を帰せますか？">
<meta property="og:url" content="https://yurustudio.github.io/teiji/">
<meta property="og:image" content="https://yurustudio.github.io/teiji/img/ogp.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="定時で帰さない">
<meta name="twitter:description" content="タップで残業、売上は青天井。でも社員の顔がどんどん…。あなたは全員を帰せますか？ #定時で帰さない">
<meta name="twitter:image" content="https://yurustudio.github.io/teiji/img/ogp.jpg">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <!-- タイトル -->
  <section id="scr-title" class="screen active">
    <div class="title-bg"></div>
    <div class="title-shade"></div>
    <div class="title-bottom">
      <p class="title-lead" id="titleLead"></p>
      <button id="btnStart" class="btn-gold big"><span data-s="start"></span><span class="chev">›</span></button>
      <div class="title-row">
        <button id="btnNew" class="btn-navy"><b data-s="newGame"></b><small data-s="newGameSub"></small></button>
        <button id="btnCont" class="btn-navy"><b data-s="cont"></b><small data-s="contSub"></small></button>
      </div>
      <p class="title-best" id="titleBest"></p>
      <div class="title-top">
      <button class="icon-btn" data-open="ach"><span class="ico">🏆</span><span data-s="btnAch"></span></button>
      <button class="icon-btn" data-open="zukan"><span class="ico">📖</span><span data-s="btnZukan"></span></button>
      <span class="sp"></span>
      <button class="icon-btn" data-open="set"><span class="ico">⚙</span><span data-s="btnSet"></span></button>
      </div>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="scr-game" class="screen">
    <div class="game-bg"></div>
    <div class="sky" id="sky"></div>
    <header class="hud">
      <div class="hud-row1">
        <div class="logo"><span class="logo-main">定時で帰さない</span><span class="logo-day" id="dayLabel"></span></div>
        <div class="hud-btns">
          <button class="mini-btn" data-open="ach" aria-label="実績">🏆</button>
          <button class="mini-btn" data-open="zukan" aria-label="図鑑">📖</button>
          <button class="mini-btn" data-open="set" aria-label="設定">⚙</button>
          <button class="mini-btn" id="btnMute" aria-label="音">🔊</button>
        </div>
        <div class="clock-box"><span class="clock-ico" id="clockIco">☾</span><span class="clock-time" id="clockTime">18:00</span><span class="clock-morale" id="moraleLabel"></span></div>
      </div>
      <div class="money-row" id="moneyRow">
        <span class="money-label" data-s="sales"></span>
        <span class="money" id="money">¥0</span>
      </div>
      <div class="rates">
        <span class="rate"><i>👆</i><b id="rateTap">+¥100</b><small data-s="perTap"></small></span>
        <span class="rate"><i>⏱</i><b id="rateSec">+¥0</b><small data-s="perSec"></small></span>
      </div>
      <div class="timebar">
        <div class="tb-end tb-left"><b>18:00</b><small data-s="teiji"></small></div>
        <div class="tb-track">
          <div class="tb-fill" id="tbFill"></div>
          <div class="tb-mark" style="left:40%"><span data-s="lastTrainMark"></span></div>
          <div class="tb-mark" style="left:73.33%"><span data-s="sunriseMark"></span></div>
          <img class="tb-runner" id="tbRunner" src="img/runner.png" alt="">
        </div>
        <div class="tb-end tb-right"><b>9:00</b><small data-s="nextMorning"></small></div>
      </div>
      <div class="buffs" id="buffs"></div>
    </header>

    <main class="office" id="office">
      <div class="desk-grid" id="deskGrid"></div>
      <div class="tap-hint" id="tapHint"><b data-s="tapHint"></b><small data-s="tapHintSub"></small></div>
      <div class="fx-layer" id="fxLayer"></div>
    </main>

    <section class="shop">
      <div class="shop-head"><b data-s="shopTitle"></b><small data-s="shopSub"></small></div>
      <div class="shop-list" id="shopList"></div>
    </section>

    <button class="home-btn" id="homeBtn">
      <span class="home-art"></span>
      <span class="home-label" data-s="homeBtn"></span>
      <span class="home-sub" data-s="homeBtnSub"></span>
    </button>
    <div class="big-moment" id="bigMoment"></div>
  </section>

  <!-- 帰宅 -->
  <section id="scr-home" class="screen">
    <div class="home-bg"></div>
    <div class="home-inner">
      <h1 class="home-head" data-s="homeHeadline"></h1>
      <p class="home-sub2" data-s="homeSub"></p>
      <div class="home-scene"><img src="img/home_scene.webp" alt=""><div class="home-bubbles" id="homeBubbles"></div></div>
      <div class="home-walk"><span class="walker">🐈</span><span data-s="homeWalking"></span><span class="walker2">🚶</span></div>
      <p class="home-thanks" id="homeThanks"></p>
      <button id="btnResult" class="btn-gold big"><span data-s="homeResult"></span><span class="chev">›</span></button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="scr-result" class="screen">
    <div class="result-bg"></div>
    <div class="result-inner" id="resultInner">
      <p class="result-head" id="resultHead"></p>
      <div class="title-badge"><span>♛ <span data-s="titleLabel"></span></span></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <p class="result-comment" id="resultComment"></p>
      <div class="result-stats">
        <div class="stat"><small data-s="statSales"></small><b id="resSales"></b></div>
        <div class="stat"><small data-s="statLeave"></small><b id="resLeave"></b></div>
        <div class="stat"><small data-s="statBest"></small><b id="resBest"></b></div>
      </div>
      <div class="result-faces" id="resFaces"></div>
      <img class="card-preview" id="cardPreview" alt="">
      <div class="result-btns">
        <button id="btnShare" class="btn-x"><span data-s="shareX"></span></button>
        <button id="btnSaveImg" class="btn-navy small"><span data-s="saveImg"></span></button>
      </div>
      <p class="result-bonus" id="resBonus"></p>
      <p class="result-note" data-s="moraleNote"></p>
      <button id="btnNext" class="btn-gold big"><span data-s="nextDay"></span><span class="chev">›</span></button>
      <button id="btnToTitle" class="btn-text" data-s="toTitle"></button>
    </div>
  </section>

  <!-- 窓 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toasts" id="toasts"></div>
</div>

<script src="js/config.js"></script>
<script src="js/strings.js"></script>
<script src="js/economy.js"></script>
<script src="js/card.js"></script>
<script src="js/game.js"></script>
</body>
</html>
