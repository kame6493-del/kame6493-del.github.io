<!doctype html>
<html lang="ja" data-theme="day" data-text="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF5FA">
<title>今日のねんねの予定 - ねかせどき</title>
<link rel="icon" href="img/icon_192.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .sv-wrap { max-width: 560px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  .sv-item { display: flex; justify-content: space-between; align-items: baseline; padding: .6rem .2rem; border-top: 1px solid var(--line); font-size: 1.15rem; font-weight: 700; }
</style>
</head>
<body>
<div class="sv-wrap" id="v"></div>
<script type="module">
// 送られてきたリンクの # の後ろだけを読む(サーバーには何も送らない・残さない)
import { decodePlan, hm, mdw, dayStart, DAY, HOUR } from './js/model.js';
const el = document.getElementById('v');
const p = decodePlan(location.hash.slice(1));
const h = new Date().getHours(); if (h >= 19 || h < 6) document.documentElement.dataset.theme = 'night';
if (!p) {
  el.innerHTML = '<h1>予定を読み取れませんでした</h1><p class="muted">リンクが途中で切れているかもしれません。送った人に、もう一度送ってもらってください。</p>';
} else {
  const first = p.items[0];
  const d0 = dayStart(p.t);
  const segs = p.seg.map(s => `<div class="seg" style="left:${((s.s - d0) / DAY * 100).toFixed(2)}%;width:${Math.max(.6, ((s.e || p.t) - s.s) / DAY * 100).toFixed(2)}%"></div>`).join('');
  el.innerHTML = `
    <p class="eyebrow">ねかせどき</p>
    <h1>${mdw(p.t)} の ねんねの予定</h1>
    <p class="muted">${hm(p.t)} に送られた予定です(目安)</p>
    ${first ? `<section class="hero"><p class="lbl">${first.label === 'bed' ? '夜のねんねの目安' : '次に寝かせる目安'}</p><p class="big num">${hm(first.at)}<span class="goro">ごろ</span></p><p class="range num">${hm(first.lo)}〜${hm(first.hi)}</p></section>`
      : `<section class="hero"><p class="mid">${p.kind === 'asleep' ? `送った時は寝ていました(${p.since ? hm(p.since) + 'から' : ''})` : p.kind === 'night' ? '送った時は夜中に起きていました' : '次の目安はまだありません'}</p></section>`}
    ${p.items.length > 1 ? `<section class="card"><h2>そのあとの目安</h2>${p.items.slice(1).map(it => `<div class="sv-item"><span class="num">${hm(it.at)} ごろ</span><span>${it.label === 'bed' ? '夜のねんね' : 'お昼寝'}</span></div>`).join('')}</section>` : ''}
    <section class="card"><h2>この日の眠り</h2><div class="tl" role="img" aria-label="この日の眠り">${segs}</div><div class="tl-ax" aria-hidden="true"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></section>
    <p class="muted">時刻は目安です。赤ちゃんの様子に合わせてください。</p>
    <p><a class="btn ghost wide" href="https://play.google.com/store/apps/details?id=jp.nekasedoki.app">ねかせどき(Android)</a></p>`;
}
</script>
</body>
</html>
